[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-pool-labflow"
version = "0.1.0"
description = "Labflow research framework for classical spectral and fuzzy relational graph reduction methods with analytical Jacobians"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.25",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
labflow = "labflow.cli:main"

[tool.setuptools.packages.find]
include = ["labflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
